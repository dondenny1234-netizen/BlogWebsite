name: Keep Render Awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          echo "Pinging Render app..."
          curl -L -I --max-time 30 https://dondenny.onrender.com/
          echo "Ping completed successfully!"